<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抖音智能经营工作台</title>
    <style>
      :root {
        --bg: #f5f6f8; --card: #fff; --border: #e5e7eb;
        --text: #111827; --muted: #6b7280;
        --accent: #2563eb; --green: #16a34a; --red: #dc2626; --amber: #d97706;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
      a { color: var(--accent); text-decoration: none; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
      th { background: #f9fafb; font-weight: 500; white-space: nowrap; }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
      .badge.green { background: #dcfce7; color: var(--green); }
      .badge.red { background: #fee2e2; color: var(--red); }
      .badge.amber { background: #fef3c7; color: var(--amber); }
      .badge.blue { background: #dbeafe; color: var(--accent); }
      .badge.gray { background: #f3f4f6; color: var(--muted); }
      .empty { color: var(--muted); text-align: center; padding: 24px; }
      .err { color: var(--red); padding: 12px; }
      .notice { padding: 10px 14px; border-radius: 8px; margin: 10px 0; font-size: 13px; }
      .notice.amber { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
    </style>
    <script type="module" crossorigin src="./assets/index-mYQQfBaW.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
