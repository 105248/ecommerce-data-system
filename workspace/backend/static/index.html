<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音智能经营工作台</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--accent:#2563eb;--red:#dc2626;--green:#16a34a;--amber:#d97706;--purple:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.side{position:fixed;top:0;left:0;bottom:0;width:200px;background:#111827;color:#d1d5db;padding:16px 0;overflow-y:auto;z-index:10}
.side .logo{color:#fff;font-size:16px;font-weight:600;padding:8px 16px 16px;border-bottom:1px solid #1f2937;margin-bottom:8px}
.side a{display:block;padding:8px 16px;color:#d1d5db;text-decoration:none;font-size:13px;border-left:3px solid transparent}
.side a:hover{background:#1f2937;color:#fff}
.side a.active{background:#1f2937;color:#fff;border-left-color:var(--accent)}
.side .grp{font-size:11px;color:#6b7280;padding:12px 16px 4px;text-transform:uppercase}
.main{margin-left:200px;padding:16px 20px}
.topbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field select,.field input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--text);background:#fff;min-width:110px}
.statusbar{display:flex;gap:20px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;margin-bottom:14px;font-size:12px;color:var(--muted)}
.statusbar b{color:var(--text);font-weight:600}
h1{font-size:18px;margin:4px 0 6px}
.sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:600;margin-top:3px}
.kpi .c{font-size:12px;margin-top:3px}
.c.up{color:var(--red)}.c.down{color:var(--green)}.c.flat{color:var(--muted)}
.c.bad{color:var(--red)}.c.good{color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;white-space:nowrap}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;white-space:nowrap}
.badge.red{background:#fee2e2;color:var(--red)}.badge.green{background:#dcfce7;color:var(--green)}
.badge.blue{background:#dbeafe;color:var(--accent)}.badge.amber{background:#fef3c7;color:var(--amber)}
.badge.gray{background:#f3f4f6;color:var(--muted)}.badge.purple{background:#ede9fe;color:var(--purple)}
.err{color:var(--red);font-size:13px;padding:10px 0}
.empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.loading{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:12px}
.notice.amber{background:#fffbeb;border-color:#fde68a;color:#92400e}
table .num{text-align:right;font-variant-numeric:tabular-nums}
.trend-note{font-size:11px;color:var(--muted);margin-top:6px}
@media(max-width:900px){.side{display:none}.main{margin-left:0}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="side" id="side"></div>
<div class="main">
  <div class="topbar" id="filters"></div>
  <div class="statusbar" id="status"></div>
  <div id="page"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
