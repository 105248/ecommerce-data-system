<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据状态｜抖音智能经营工作台</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--green:#16a34a;--red:#dc2626}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:24px}
h1{font-size:20px;margin-bottom:16px}
nav a{color:#2563eb;text-decoration:none;margin-right:16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:16px;max-width:720px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500}
.badge{padding:2px 10px;border-radius:10px;font-size:12px}
.badge.green{background:#dcfce7;color:var(--green)}.badge.red{background:#fee2e2;color:var(--red)}
</style>
</head>
<body>
<nav><a href="/">首页</a><a href="/system-status">系统状态</a><a href="/data-status">数据状态</a></nav>
<h1>数据状态</h1>
<div class="card"><table><thead><tr><th>店铺</th><th>最早日期</th><th>最新日期</th><th>天数</th><th>行数</th><th>时间类型</th><th>状态</th></tr></thead><tbody id="tb"></tbody></table></div>
<script>
async function load(){
  try{
    const j = await fetch('/api/v1/data-status').then(r=>r.json());
    document.getElementById('tb').innerHTML = j.data.map(x=>`
      <tr><td>${x.shop_name}</td><td>${x.min_date}</td><td>${x.max_date}</td>
      <td>${x.day_count}</td><td>${x.row_count}</td><td>DAILY_FACT</td>
      <td><span class="badge green">OK</span></td></tr>`).join('');
  }catch(e){
    document.getElementById('tb').innerHTML = `<tr><td colspan="7" style="color:var(--red)">${e.message}</td></tr>`;
  }
}
load();
</script>
</body>
</html>
